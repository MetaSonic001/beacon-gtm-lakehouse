# ==============================================================================
# Beacon GTM Lakehouse — Local Infrastructure
# ==============================================================================
# Everything required for the data platform runs on your laptop via Docker.
# No cloud account needed.
#
#   +-----------+   +----------+   +--------------------------------------+
#   |  MinIO    |   | Postgres |   |  Redpanda (Kafka-API)                 |
#   | (S3 lake) |   | (serving)|   | + Redpanda Console (topic UI)         |
#   +-----------+   +----------+   +--------------------------------------+
#   |   Spark   |   (spark-submit runs as a one-shot container)
#   +-----------+
#   |  Airflow  |   (webserver + scheduler + init, always-on)
#   +-----------+
#
# Design note: Spark runs as a CONTAINER built from Dockerfile.spark. This
# sidesteps the significant pain of running Hadoop/Spark natively on Windows
# (needs winutils etc.). You invoke jobs with:
#     docker compose run --rm spark spark-submit [options] /app/spark_jobs/xxx.py
# Airflow runs as a built image from Dockerfile.airflow with LocalExecutor
# (no Celery/Redis needed at this scale). DAGs are volume-mounted from
# ./airflow/dags so edits apply immediately.
# Credentials here are read from your .env file (${VAR} syntax).
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object store. This is the "data lake" storage layer:
  # Bronze / Silver / Gold zones are stored as objects in MinIO buckets.
  # - Port 9000  : S3 API (used by Spark via s3a:// protocol)
  # - Port 9001  : Web console (browser UI to inspect buckets/objects)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: beacon-minio
    ports:
      - "9000:9000"   # S3 API (Spark reads/writes through this)
      - "9001:9001"   # Web console (http://localhost:9001)
    environment:
      # Read from .env so credentials are not hardcoded in the repo
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-beacon}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-beacon12345}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beacon-net

  # ---------------------------------------------------------------------------
  # minio-init — one-shot helper that creates the lakehouse buckets on startup.
  # Uses the official MinIO client (mc) so no host SDK is required.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: beacon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      echo "Creating MinIO buckets..."
      mc alias set beacon http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY}
      mc mb -p beacon/beacon-raw beacon/beacon-curated beacon/beacon-gold
      mc mb -p beacon/beacon-lakehouse
      echo "Buckets ready."
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-beacon}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-beacon12345}
    networks:
      - beacon-net

  # ---------------------------------------------------------------------------
  # Postgres — serving layer. Holds the final Gold tables that a BI tool queries.
  # The Gold schema is mounted as an init script, so it auto-creates on first boot.
  # - Port 5432 : SQL access
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: beacon-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-beacon}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-beacon}
      POSTGRES_DB: ${PG_DB:-beacon}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/gold_schema.sql:/docker-entrypoint-initdb.d/01_gold_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-beacon} -d ${PG_DB:-beacon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beacon-net

  # ---------------------------------------------------------------------------
  # Redpanda — Kafka-API-compatible streaming broker. Lighter than Kafka+Zookeeper.
  # Used for the OPTIONAL real-time ingestion path (streaming_events.py).
  # - Port 19092 : Kafka API (from your host)
  # - Port 9644  : Admin API
  # ---------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: beacon-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"   # Kafka API, use this from your host machine
      - "9644:9644"     # admin API
    networks:
      - beacon-net

  # ---------------------------------------------------------------------------
  # Redpanda Console — web UI to watch Kafka topics and messages.
  # - Port 8080 : browser UI (http://localhost:8080)
  # ---------------------------------------------------------------------------
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: beacon-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
    networks:
      - beacon-net

  # ---------------------------------------------------------------------------
  # Spark — batch processing engine. Runs as a "sleeping" container; you invoke
  # spark-submit jobs with: docker compose run --rm spark <command>
  # All JARs (Delta, S3A, Postgres JDBC, Kafka) are baked into the image.
  # This avoids the native Hadoop/winutils and Windows pain entirely.
  # ---------------------------------------------------------------------------
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: beacon-spark
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-beacon}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-beacon12345}
      PG_HOST: postgres      # reaches Postgres via its Docker service name
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-beacon}
      PG_USER: ${PG_USER:-beacon}
      PG_PASSWORD: ${PG_PASSWORD:-beacon}
      KAFKA_BROKERS: redpanda:29092  # internal broker address (not localhost!)
      KAFKA_TOPIC: ${KAFKA_TOPIC:-gtm-events}
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["sleep", "infinity"]   # keep alive so docker compose run works
    entrypoint: []
    # Bind the host ./data directory into the container at /app/data so that
    # bronze/silver/gold Parquet written by one `docker compose run` survives
    # into the next (one-off containers are ephemeral otherwise). This is the
    # shared, persistent "local lake" the batch pipeline reads/writes.
    #
    # The Python source dirs are ALSO bind-mounted so code edits apply without
    # a Docker rebuild (the image still bakes them in as a fallback). The
    # baked JARs (Delta, S3A, JDBC, Kafka) live in the image, not in a mount,
    # so spark-submit still works offline.
    volumes:
      - ./data:/app/data
      - ./spark_jobs:/app/spark_jobs
      - ./ingestion:/app/ingestion
      - ./scripts:/app/scripts
      - ./sql:/app/sql
      - ./actual_maven_data:/app/actual_maven_data
    networks:
      - beacon-net

  # ---------------------------------------------------------------------------
  # Airflow — Orchestration (always-on). Uses LocalExecutor for simplicity.
  # Webserver: http://localhost:8080
  # Scheduler: runs DAGs on schedule
  # Init: initializes DB + creates admin user on first run
  # Triggerer: supports deferrable operators (future-proofing)
  # ---------------------------------------------------------------------------
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: beacon-airflow-init
    command: >
      bash -c "
      airflow db upgrade &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
      "
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-beacon}:${PG_PASSWORD:-beacon}@postgres:5432/${PG_DB:-beacon}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme}
      PROJECT_ROOT: /opt/beacon
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./data:/opt/airflow/data
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
    networks:
      - beacon-net

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: beacon-airflow-webserver
    command: webserver
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-beacon}:${PG_PASSWORD:-beacon}@postgres:5432/${PG_DB:-beacon}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme}
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8081
      PROJECT_ROOT: /opt/beacon
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./data:/opt/airflow/data
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - beacon-net

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: beacon-airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-beacon}:${PG_PASSWORD:-beacon}@postgres:5432/${PG_DB:-beacon}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme}
      PROJECT_ROOT: /opt/beacon
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./data:/opt/airflow/data
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - beacon-net

  airflow-triggerer:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: beacon-airflow-triggerer
    command: triggerer
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-beacon}:${PG_PASSWORD:-beacon}@postgres:5432/${PG_DB:-beacon}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme}
      PROJECT_ROOT: /opt/beacon
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./data:/opt/airflow/data
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
    networks:
      - beacon-net

# ---------------------------------------------------------------------------
# Named volumes (persist data across container restarts)
# ---------------------------------------------------------------------------
volumes:
  minio_data:
  pg_data:

# ---------------------------------------------------------------------------
# Explicit network so all services can find each other by name
# (e.g. Spark-in-container reaches MinIO at http://minio:9000)
# ---------------------------------------------------------------------------
networks:
  beacon-net:
    driver: bridge
