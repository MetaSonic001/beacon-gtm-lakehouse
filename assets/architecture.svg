<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--edge)"/>
    </marker>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="var(--edge)"/>
    </marker>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98a5a"/><stop offset="1" stop-color="#a9663a"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9c2cf"/><stop offset="1" stop-color="#8f9bad"/>
    </linearGradient>
    <style>
      :root { --bg:#f8fafc; --card:#ffffff; --card2:#f1f5f9; --txt:#0f172a; --mut:#475569;
              --edge:#64748b; --border:#e2e8f0; --chip:#f1f5f9; --chipTxt:#334155; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0b1220; --card:#111a2e; --card2:#0d1526; --txt:#e2e8f0; --mut:#94a3b8;
                --edge:#7c8aa0; --border:#24324a; --chip:#1e293b; --chipTxt:#cbd5e1; }
      }
      rect.card { fill: var(--card); stroke: var(--border); }
      rect.card2 { fill: var(--card2); stroke: var(--border); }
      text { fill: var(--txt); }
      text.mut { fill: var(--mut); }
      .chip text { fill: var(--chipTxt); }
      .edge { stroke: var(--edge); }
      .title { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: var(--mut); }
      .boxTitle { font-size: 13.5px; font-weight: 700; }
      .boxBody { font-size: 11px; fill: var(--mut); }
      .lbl { font-size: 11.5px; font-weight: 600; fill: var(--mut); }
      .badge { font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="var(--bg)"/>
  <text x="30" y="38" class="title">Beacon GTM Lakehouse — architecture</text>
  <text x="30" y="58" class="sub">Actual Maven CRM → Bronze → Silver → Gold → PostgreSQL → BI · batch + streaming + orchestration, all local</text>

  <!-- ===================== BATCH FLOW (middle row) ===================== -->

  <!-- Sources -->
  <rect class="card" x="30" y="330" width="150" height="120" rx="10"/>
  <text x="105" y="352" text-anchor="middle" class="boxTitle">📦 Data sources</text>
  <g class="chip"><rect x="46" y="364" width="118" height="18" rx="9" fill="var(--chip)"/><text x="105" y="377" text-anchor="middle" class="badge">accounts.csv</text></g>
  <g class="chip"><rect x="46" y="386" width="118" height="18" rx="9" fill="var(--chip)"/><text x="105" y="399" text-anchor="middle" class="badge">products.csv</text></g>
  <g class="chip"><rect x="46" y="408" width="118" height="18" rx="9" fill="var(--chip)"/><text x="105" y="421" text-anchor="middle" class="badge">sales_teams.csv</text></g>
  <g class="chip"><rect x="46" y="430" width="118" height="18" rx="9" fill="var(--chip)"/><text x="105" y="443" text-anchor="middle" class="badge">sales_pipeline.csv</text></g>

  <!-- Ingest -->
  <line x1="180" y1="390" x2="242" y2="390" class="edge" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bronze -->
  <rect class="card2" x="252" y="330" width="150" height="120" rx="10"/>
  <rect x="252" y="330" width="150" height="30" rx="10" fill="url(#bronzeGrad)" opacity="0.85"/>
  <rect x="252" y="345" width="150" height="15" fill="url(#bronzeGrad)" opacity="0.85"/>
  <text x="327" y="350" text-anchor="middle" class="boxTitle" fill="#fff">🥉 BRONZE</text>
  <text x="327" y="386" text-anchor="middle" class="boxBody">raw landing zone</text>
  <text x="327" y="403" text-anchor="middle" class="boxBody">as-is CSVs (lightly cleaned)</text>
  <text x="327" y="420" text-anchor="middle" class="boxBody">data/bronze/maven/</text>
  <text x="327" y="440" text-anchor="middle" class="badge" fill="var(--mut)">immutable input</text>

  <!-- Bronze -> Silver -->
  <line x1="402" y1="390" x2="464" y2="390" class="edge" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Silver -->
  <rect class="card2" x="474" y="330" width="150" height="120" rx="10"/>
  <rect x="474" y="330" width="150" height="30" rx="10" fill="url(#silverGrad)" opacity="0.85"/>
  <rect x="474" y="345" width="150" height="15" fill="url(#silverGrad)" opacity="0.85"/>
  <text x="549" y="350" text-anchor="middle" class="boxTitle" fill="#fff">🥈 SILVER</text>
  <text x="549" y="386" text-anchor="middle" class="boxBody">validated · deduplicated</text>
  <text x="549" y="403" text-anchor="middle" class="boxBody">schema enforced</text>
  <text x="549" y="420" text-anchor="middle" class="boxBody">Parquet, yr/mo-partitioned</text>
  <text x="549" y="440" text-anchor="middle" class="badge" fill="var(--mut)">every row is clean</text>

  <!-- Silver -> quarantine (down) -->
  <line x1="549" y1="450" x2="549" y2="496" class="edge" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="card" x="449" y="506" width="200" height="52" rx="10"/>
  <text x="549" y="526" text-anchor="middle" class="boxTitle">⛔ QUARANTINE</text>
  <text x="549" y="544" text-anchor="middle" class="boxBody">rejected rows + reason flags</text>

  <!-- Silver -> Gold -->
  <line x1="624" y1="390" x2="686" y2="390" class="edge" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gold -->
  <rect class="card2" x="696" y="330" width="150" height="120" rx="10"/>
  <rect x="696" y="330" width="150" height="30" rx="10" fill="url(#goldGrad)" opacity="0.9"/>
  <rect x="696" y="345" width="150" height="15" fill="url(#goldGrad)" opacity="0.9"/>
  <text x="771" y="350" text-anchor="middle" class="boxTitle" fill="#3b2a00">🥇 GOLD</text>
  <text x="771" y="386" text-anchor="middle" class="boxBody">pre-aggregated, BI-ready</text>
  <text x="771" y="403" text-anchor="middle" class="boxBody">account · rep · product</text>
  <text x="771" y="420" text-anchor="middle" class="boxBody">funnel · monthly_revenue</text>
  <text x="771" y="440" text-anchor="middle" class="badge" fill="var(--mut)">query-ready metrics</text>

  <!-- Gold -> Postgres -->
  <line x1="846" y1="390" x2="908" y2="390" class="edge" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Postgres -->
  <rect class="card2" x="918" y="330" width="150" height="120" rx="10"/>
  <rect x="918" y="330" width="150" height="30" rx="10" fill="#2f5d7a"/>
  <rect x="918" y="345" width="150" height="15" fill="#2f5d7a"/>
  <text x="993" y="350" text-anchor="middle" class="boxTitle" fill="#fff">🗄️ POSTGRES</text>
  <text x="993" y="386" text-anchor="middle" class="boxBody">gold.* serving layer</text>
  <text x="993" y="403" text-anchor="middle" class="boxBody">load_gold_to_postgres.py</text>
  <text x="993" y="420" text-anchor="middle" class="boxBody">via JDBC</text>
  <text x="993" y="440" text-anchor="middle" class="badge" fill="var(--mut)">query with plain SQL</text>

  <!-- Postgres -> BI -->
  <line x1="1068" y1="390" x2="1130" y2="390" class="edge" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BI -->
  <rect class="card" x="1140" y="330" width="80" height="120" rx="10"/>
  <text x="1180" y="352" text-anchor="middle" class="boxTitle">📊 BI</text>
  <text x="1180" y="372" text-anchor="middle" class="boxBody">Streamlit</text>
  <text x="1180" y="388" text-anchor="middle" class="boxBody">dashboard</text>
  <text x="1180" y="412" text-anchor="middle" class="boxBody">Power BI</text>
  <text x="1180" y="428" text-anchor="middle" class="boxBody">Tableau</text>
  <text x="1180" y="444" text-anchor="middle" class="boxBody">Looker</text>

  <!-- ===================== STREAMING PATH (top) ===================== -->
  <line x1="327" y1="330" x2="327" y2="250" class="edge" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="327" y="238" text-anchor="middle" class="lbl">events</text>

  <!-- Streaming consumer -->
  <rect class="card" x="237" y="170" width="180" height="60" rx="10"/>
  <text x="327" y="192" text-anchor="middle" class="boxTitle">⚡ Spark Structured Streaming</text>
  <text x="327" y="212" text-anchor="middle" class="boxBody">spark_jobs/streaming_events.py</text>

  <line x1="327" y1="170" x2="327" y2="140" class="edge" stroke-width="2" marker-end="url(#arrowUp)"/>

  <!-- Redpanda -->
  <rect class="card" x="237" y="90" width="180" height="50" rx="10"/>
  <rect x="237" y="90" width="180" height="26" rx="10" fill="#c2453f"/>
  <rect x="237" y="101" width="180" height="15" fill="#c2453f"/>
  <text x="327" y="108" text-anchor="middle" class="boxTitle" fill="#fff">🔴 REDPANDA (Kafka API)</text>
  <text x="327" y="130" text-anchor="middle" class="boxBody">topic gtm-events</text>

  <line x1="327" y1="90" x2="327" y2="60" class="edge" stroke-width="2" marker-end="url(#arrowUp)"/>

  <!-- Producer -->
  <rect class="card" x="237" y="18" width="180" height="42" rx="10"/>
  <text x="327" y="37" text-anchor="middle" class="boxTitle">📤 Kafka producer</text>
  <text x="327" y="52" text-anchor="middle" class="boxBody">ingestion/kafka_producer.py</text>

  <text x="30" y="108" class="boxTitle">📡 Streaming path (optional)</text>
  <text x="30" y="128" class="boxBody">publish deal/website events → Redpanda (Kafka-API)</text>
  <text x="30" y="145" class="boxBody">→ Spark Structured Streaming (watermark + dedup) → Bronze</text>

  <!-- ===================== ORCHESTRATION (bottom) ===================== -->
  <rect class="card" x="30" y="600" width="1190" height="150" rx="12"/>
  <rect x="30" y="600" width="1190" height="34" rx="12" fill="#0b6ab8"/>
  <rect x="30" y="617" width="1190" height="17" fill="#0b6ab8"/>
  <text x="50" y="622" class="boxTitle" fill="#fff">⏱️ AIRFLOW ORCHESTRATION — DAG beacon_gtm_pipeline (daily schedule · retries · backoff)</text>

  <g class="chip"><rect x="60" y="652" width="160" height="24" rx="12" fill="var(--chip)"/><text x="140" y="669" text-anchor="middle" class="badge">1 · ingest → bronze</text></g>
  <g class="chip"><rect x="240" y="652" width="170" height="24" rx="12" fill="var(--chip)"/><text x="325" y="669" text-anchor="middle" class="badge">2 · bronze → silver</text></g>
  <g class="chip"><rect x="430" y="652" width="150" height="24" rx="12" fill="var(--chip)"/><text x="505" y="669" text-anchor="middle" class="badge">3 · silver → gold</text></g>
  <g class="chip"><rect x="600" y="652" width="180" height="24" rx="12" fill="var(--chip)"/><text x="690" y="669" text-anchor="middle" class="badge">4 · gold → postgres</text></g>
  <text x="60" y="706" class="boxBody">Tasks run in dependency order with retries + exponential backoff; idempotent overwrite. Airflow webserver/scheduler/triggerer are always-on.</text>
  <text x="60" y="726" class="boxBody">Manual one-shot alternative: <tspan font-family="Consolas,monospace">python scripts/run_pipeline.py</tspan> (streams + saves a log, appends to the quality log).</text>

  <!-- Airflow wraps batch: dashed vertical guides -->
  <line x1="327" y1="558" x2="327" y2="600" class="edge" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="771" y1="558" x2="771" y2="600" class="edge" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="549" y="582" text-anchor="middle" class="lbl">Airflow schedules the batch steps</text>
</svg>
